<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Translate — LibreTranslate + Piper TTS</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>" />
</head>
<body>
  <header class="topbar">
    <h1><span class="logo">🌐</span> Translate</h1>
    <div class="status" id="status" title="Backend status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">connecting…</span>
    </div>
  </header>

  <main class="workspace">
    <!-- Language bar -->
    <div class="langbar">
      <label class="field">
        <span class="field-label">From</span>
        <select id="sourceLang" aria-label="Source language">
          <option value="auto">Detect language</option>
        </select>
      </label>

      <button id="swapBtn" class="swap" type="button" title="Swap languages" aria-label="Swap languages">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 4v13M7 4L4 7M7 4l3 3M17 20V7M17 20l3-3M17 20l-3-3" />
        </svg>
      </button>

      <label class="field">
        <span class="field-label">To</span>
        <select id="targetLang" aria-label="Target language"></select>
      </label>
    </div>

    <!-- Panels -->
    <div class="panels">
      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">Source text</span>
          <span class="detected" id="detected" hidden></span>
        </div>
        <textarea id="sourceText" placeholder="Type or paste text here…&#10;&#10;Tip: press Ctrl + Enter to translate." spellcheck="false" maxlength="5000"></textarea>
        <div class="panel-foot">
          <span class="counter"><span id="charCount">0</span> / 5000</span>
          <div class="actions">
            <button class="icon-btn" data-speak="source" type="button" title="Listen to source text">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              <span>Listen</span>
            </button>
            <button class="icon-btn" data-copy="source" type="button" title="Copy source text">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Copy</span>
            </button>
            <button class="icon-btn danger" id="clearBtn" type="button" title="Clear source text">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
              <span>Clear</span>
            </button>
          </div>
        </div>
      </section>

      <section class="panel output">
        <div class="panel-head">
          <span class="panel-title">Translation</span>
          <span class="spinner" id="spinner" hidden></span>
        </div>
        <div id="targetText" class="result" aria-live="polite" data-placeholder="Translation will appear here."></div>
        <div class="panel-foot">
          <span class="counter" id="engineNote">LibreTranslate</span>
          <div class="actions">
            <button class="icon-btn" data-speak="target" type="button" title="Listen to translation">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
              <span>Listen</span>
            </button>
            <button class="icon-btn primary-ghost" data-copy="target" type="button" title="Copy translation">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Copy</span>
            </button>
          </div>
        </div>
      </section>
    </div>

    <div class="submit-row">
      <label class="auto-toggle">
        <input type="checkbox" id="autoTranslate" checked />
        <span>Translate as I type</span>
      </label>
      <button id="translateBtn" class="primary" type="button">
        Translate
        <kbd>Ctrl</kbd><kbd>↵</kbd>
      </button>
    </div>

    <p class="error" id="error" hidden></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="player" hidden></audio>

  <footer class="foot">
    Translations by <strong>LibreTranslate</strong> · Speech by <strong>Piper TTS</strong>
  </footer>

  <script src="app.js"></script>
</body>
</html>
